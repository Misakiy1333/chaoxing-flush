<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理后台 · 超星刷课 · 飞飞</title>
<style>
/* ===================== 设计变量 ===================== */
:root{
  --bg:#080d13;
  --surface:#111a24;
  --surface-2:#0c141c;
  --surface-3:#18242f;
  --line:#1e2d3a;
  --line-soft:#16222c;
  --line-hi:#2a4052;
  --txt:#e8eff5;
  --txt-dim:#8ea6b8;
  --txt-faint:#5d7a8f;
  --acc:#5ec8ff;
  --acc-2:#7ee8d0;
  --acc-deep:#2b8cf5;
  --acc-glow:rgba(94,200,255,.22);
  --ok:#3ddc84;
  --warn:#ffc247;
  --bad:#ff5c5c;
  --cool:#ff9f43;
  --r-sm:8px;
  --r-md:12px;
  --r-lg:18px;
  --sh-1:0 1px 2px rgba(0,0,0,.34);
  --sh-2:0 4px 16px -6px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Inter","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(900px 520px at 50% -12%,rgba(58,140,247,.18) 0%,transparent 62%),
    radial-gradient(640px 420px at 8% 22%,rgba(126,232,208,.07) 0%,transparent 60%),
    radial-gradient(700px 460px at 96% 68%,rgba(120,90,255,.07) 0%,transparent 62%),
    var(--bg);
  background-attachment:fixed;
  color:var(--txt);padding:28px 20px 48px;max-width:1240px;margin:0 auto;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-size:14px;line-height:1.62;min-height:100vh;
}
body::before{
  content:"";position:fixed;top:0;left:0;right:0;height:2px;z-index:99;
  background:linear-gradient(90deg,transparent,var(--acc-deep),var(--acc),var(--acc-2),transparent);
  opacity:.75;
}
h1{
  font-size:21px;font-weight:700;letter-spacing:-.2px;
  background:linear-gradient(135deg,#ffffff,var(--acc) 70%,var(--acc-2));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
a{color:var(--acc);text-decoration:none;transition:color .15s}
a:hover{color:var(--acc-2);text-decoration:none}
code{
  background:rgba(94,200,255,.09);border:1px solid rgba(94,200,255,.22);
  border-radius:5px;padding:2px 6px;font-size:12px;color:#9ad9f5;
  font-family:"JetBrains Mono",Consolas,monospace;
}

/* ===================== 顶栏 ===================== */
.top{
  display:flex;justify-content:space-between;align-items:center;gap:14px;
  flex-wrap:wrap;margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--line-soft);
}
.sub{color:var(--txt-dim);font-size:12.5px;margin-top:7px;line-height:1.7}

/* ===================== 卡片 ===================== */
.card{
  position:relative;
  background:
    linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 42%),
    linear-gradient(180deg,var(--surface) 0%,#0e1720 100%);
  border:1px solid var(--line);border-radius:var(--r-lg);
  padding:20px 22px;margin-bottom:16px;
  box-shadow:var(--sh-1),var(--sh-2);
  transition:border-color .25s,box-shadow .25s;
}
.card:hover{border-color:var(--line-hi);box-shadow:var(--sh-1),0 10px 34px -10px rgba(0,0,0,.7)}
.card::before{
  content:"";position:absolute;left:22px;right:22px;top:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(94,200,255,.4),transparent);
  opacity:.6;pointer-events:none;
}
.card h2{
  font-size:13.5px;color:#b6d2e4;font-weight:600;margin-bottom:16px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding-bottom:12px;border-bottom:1px solid var(--line-soft);letter-spacing:.3px;
}
.card h2::before{
  content:"";width:4px;height:14px;border-radius:3px;flex:none;
  background:linear-gradient(180deg,var(--acc),var(--acc-deep));
  box-shadow:0 0 10px -1px var(--acc-glow);
}

/* ===================== 统计 ===================== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));gap:11px}
.stat{
  position:relative;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0) 60%),var(--surface-2);
  border:1px solid var(--line-soft);border-radius:var(--r-md);
  padding:16px 11px 14px;text-align:center;
  transition:transform .2s,border-color .2s,box-shadow .2s;
}
.stat::after{
  content:"";position:absolute;inset:0;border-radius:var(--r-md);
  background:radial-gradient(120px 60px at 50% 0%,var(--acc-glow),transparent 70%);
  opacity:0;transition:opacity .25s;pointer-events:none;
}
.stat:hover{transform:translateY(-2px);border-color:var(--line-hi);box-shadow:0 8px 22px -12px rgba(0,0,0,.8)}
.stat:hover::after{opacity:.55}
.stat b{
  display:block;font-size:23px;color:var(--acc);font-variant-numeric:tabular-nums;
  line-height:1.2;font-weight:700;letter-spacing:-.6px;text-shadow:0 0 22px var(--acc-glow);
}
.stat span{font-size:11.5px;color:var(--txt-dim);display:block;margin-top:5px;letter-spacing:.3px}

/* ===================== 表格 ===================== */
.table-wrap{
  overflow-x:auto;border-radius:var(--r-md);border:1px solid var(--line-soft);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.3);
}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:12px 13px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
th{
  color:var(--txt-dim);font-weight:600;font-size:11.5px;
  background:linear-gradient(180deg,#101b25,var(--surface-2));
  letter-spacing:.5px;position:sticky;top:0;z-index:1;
  border-bottom:1px solid var(--line);
}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .15s}
tbody tr:hover td{background:rgba(94,200,255,.05)}
td b{font-variant-numeric:tabular-nums;color:var(--txt);font-weight:600}

/* ===================== 状态标签 ===================== */
.pill{
  display:inline-flex;align-items:center;gap:6px;border-radius:20px;
  padding:4px 11px;font-size:11.5px;border:1px solid var(--line-hi);
  background:var(--surface-2);font-weight:600;
}
.pill i{width:6px;height:6px;border-radius:50%;display:inline-block;flex:none;background:var(--txt-faint)}
.pill.on{color:#8ff0bb;border-color:rgba(61,220,132,.35);background:rgba(61,220,132,.09)}
.pill.on i{background:var(--ok);box-shadow:0 0 8px rgba(61,220,132,.9)}
.pill.off{color:#8fa6b4}
.pill.warn{color:#ffdb8f;border-color:rgba(255,194,71,.35);background:rgba(255,194,71,.09)}
.pill.warn i{background:var(--warn);box-shadow:0 0 8px rgba(255,194,71,.9)}
.pill.bad{color:#ffa8a8;border-color:rgba(255,92,92,.35);background:rgba(255,92,92,.09)}
.pill.bad i{background:var(--bad);box-shadow:0 0 8px rgba(255,92,92,.9)}

/* ===================== 按钮 ===================== */
button{
  background:linear-gradient(180deg,#3d9bfb,var(--acc-deep));
  border:1px solid rgba(94,200,255,.45);
  color:#fff;border-radius:var(--r-sm);padding:10px 19px;font-size:13px;
  cursor:pointer;font-family:inherit;font-weight:600;letter-spacing:.3px;
  white-space:nowrap;
  box-shadow:0 2px 8px -2px rgba(43,140,245,.5),inset 0 1px 0 rgba(255,255,255,.16);
  transition:transform .13s,box-shadow .18s,filter .18s;
}
button:hover{
  filter:brightness(1.09);
  box-shadow:0 4px 18px -4px rgba(43,140,245,.7),inset 0 1px 0 rgba(255,255,255,.2);
}
button:active{transform:translateY(1px) scale(.995)}
button:disabled{
  background:#1e2b36;border-color:#22323f;color:#5b7386;cursor:not-allowed;
  filter:none;box-shadow:none;transform:none;
}
button.ghost{
  background:rgba(255,255,255,.035);border:1px solid var(--line-hi);color:#a4bccc;font-weight:500;
  box-shadow:none;
}
button.ghost:hover{
  border-color:var(--acc);color:var(--acc);background:rgba(94,200,255,.09);
  box-shadow:0 0 18px -8px var(--acc-glow);
}
button.danger{
  background:linear-gradient(180deg,#ff6360,#e03030);
  border-color:rgba(255,120,120,.5);
  box-shadow:0 2px 8px -2px rgba(224,48,48,.5),inset 0 1px 0 rgba(255,255,255,.16);
}
button.danger:hover{box-shadow:0 4px 18px -4px rgba(224,48,48,.7)}
button.mini{padding:6px 12px;font-size:12px}

/* ===================== 表单 ===================== */
input,textarea,select{
  background:var(--surface-2);border:1px solid #274256;color:var(--txt);
  border-radius:var(--r-sm);padding:9px 11px;font-size:13px;width:100%;
  font-family:inherit;transition:border-color .15s,box-shadow .15s;
}
input:hover,textarea:hover,select:hover{border-color:#33556d}
input:focus,textarea:focus,select:focus{
  outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(79,195,247,.13);
}
input::placeholder,textarea::placeholder{color:#4d6577}
select{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#6b8ba0 50%),linear-gradient(135deg,#6b8ba0 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea{min-height:130px;line-height:1.85;resize:vertical}
label{display:block;font-size:12px;color:var(--txt-dim);margin-bottom:6px;font-weight:500;letter-spacing:.2px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.f{flex:1;min-width:160px}

/* ===================== 白名单项 ===================== */
.wl{
  display:flex;align-items:center;gap:11px;background:var(--surface-2);
  border:1px solid var(--line-soft);border-radius:var(--r-sm);
  padding:10px 13px;margin:7px 0;transition:.15s;
}
.wl:hover{background:var(--surface-3);border-color:var(--line-hi)}
.wl .u{flex:1;font-size:14px;font-variant-numeric:tabular-nums}

/* ===================== 提示 ===================== */
.msg{font-size:12.5px;min-height:18px;margin-top:10px;line-height:1.7}
.ok{color:var(--ok)}
.err{color:var(--bad)}
.warn{color:var(--warn)}
.note{font-size:12px;color:var(--txt-faint);margin-top:10px;line-height:1.9}

/* ===================== 页脚 ===================== */
.foot{
  margin-top:24px;padding-top:18px;border-top:1px solid var(--line-soft);
  text-align:center;font-size:12px;color:var(--txt-faint);line-height:2;
}
.foot b{color:var(--acc);font-weight:600}
.hide{display:none!important}

/* ===================== 响应式 ===================== */
@media(max-width:700px){
  body{padding:16px 12px 30px;font-size:13.5px}
  .card{padding:15px 14px;border-radius:var(--r-md)}
  .stat b{font-size:19px}
  .stats{grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
  th,td{padding:9px 8px;font-size:12px}
  h1{font-size:18px}
}
</style>
</head>
<body>

<div class="top">
  <div>
    <h1>🛠 管理后台 <span style="font-size:11px;color:var(--acc);border:1px solid var(--line-hi);border-radius:20px;padding:2px 10px;margin-left:6px">飞飞</span></h1>
    <div class="sub" id="whoLine">正在校验权限…</div>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="ghost" id="refreshBtn">刷新</button>
    <a href="/" class="ghost" style="border:1px solid var(--line-hi);border-radius:6px;padding:8px 16px;font-size:13px;color:#a4bccc">返回前台</a>
  </div>
</div>

<div id="deny" class="card hide" style="border-color:#5c2b2b">
  <h2 style="color:#ef9a9a">没有权限</h2>
  <div style="font-size:13px;color:#a8c2d4;line-height:2">
    这个页面只允许管理员账号进入。<br>
    请先用管理员的超星账号在 <a href="/">前台</a> 登录，再回来打开本页。
  </div>
</div>

<div id="main" class="hide">

  <div class="card">
    <h2>总览</h2>
    <div class="stats">      <div class="stat"><b id="sUsers">-</b><span>账号总数</span></div>
      <div class="stat"><b id="sRunning">-</b><span>正在刷</span></div>
      <div class="stat"><b id="sPassed">-</b><span>累计完成视频</span></div>
      <div class="stat"><b id="sMem">-</b><span>内存 MB</span></div>
      <div class="stat"><b id="sUp">-</b><span>运行时长</span></div>
      <div class="stat"><b id="sVer">-</b><span>版本</span></div>
    </div>
  </div>

  <div class="card">
    <h2>用户 <span style="font-size:11.5px;color:var(--txt-dim);font-weight:400;margin-left:2px">每 5 秒自动刷新</span></h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>账号</th><th>状态</th><th>已完成</th><th>失败</th><th>风控</th><th>在线</th><th>白名单</th><th>最后登录</th><th>操作</th></tr>
        </thead>
        <tbody id="userRows"><tr><td colspan="9" style="color:var(--txt-dim);text-align:center;padding:24px">加载中…</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h2>白名单</h2>
    <div class="row" style="margin-bottom:12px">
      <div class="f" style="max-width:190px">
        <label>限制开关</label>
        <select id="wlEnabled">
          <option value="0">关闭（谁都能登录）</option>
          <option value="1">开启（只允许名单内）</option>
        </select>
      </div>
      <div class="f">
        <label>添加账号</label>
        <input id="wlInput" placeholder="手机号/学号，多个用逗号隔开">
      </div>
      <button id="wlAddBtn">添加</button>
    </div>
    <div id="wlList"></div>
    <div class="msg" id="wlMsg"></div>
  </div>

  <div class="card">
    <h2>更新公告</h2>
    <div class="row">
      <div class="f" style="max-width:210px"><label>标题</label><input id="annTitle" value="更新公告"></div>
    </div>
    <div style="margin-top:12px">
      <label>公告内容（每行一条）</label>
      <textarea id="annItems" placeholder="每行一条公告内容"></textarea>
    </div>
    <div style="margin-top:12px"><button id="annSave">发布公告</button></div>
    <div class="msg" id="annMsg"></div>
  </div>

  <div class="card">
    <h2>本地版下载</h2>
    <div class="row">
      <div class="f" style="max-width:130px"><label>版本号</label><input id="relVer" placeholder="3.7"></div>
      <div class="f"><label>蓝奏云分享链接</label><input id="relUrl" placeholder="https://wwang.lanzouv.com/xxxxx"></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div class="f"><label>说明（含提取码，例如：本地版安装包（蓝奏云，提取码 ff666））</label><input id="relNote"></div>
      <button id="relSave">发布</button>
    </div>
    <div class="msg" id="relMsg"></div>
  </div>

  <div class="foot">
    <b>超星刷课 · 管理后台</b>　由 <b>飞飞</b> 开发维护<br>
    联系邮箱 <b>cc040921f@gmail.com</b>
  </div>
</div>

<script>
var D = {};      // 最近一次 overview 数据
var timer = null;

function $(id){ return document.getElementById(id); }
function esc(s){ var d=document.createElement("div"); d.textContent=(s==null?"":String(s)); return d.innerHTML; }
function fmtTime(ms){ if(!ms) return "-"; var d=new Date(ms); return (d.getMonth()+1)+"-"+String(d.getDate()).padStart(2,"0")+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function fmtDur(sec){ sec=Math.max(0,Math.floor(sec||0)); var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60); return h? h+"h"+m+"m" : m+"m"; }
function msg(id,t,c){ var e=$(id); if(e){ e.textContent=t||""; e.className="msg "+(c||""); } }

async function api(path, opt){
  opt = opt || {};
  var r = await fetch(path, Object.assign({ cache:"no-store" }, opt));
  if(r.status === 401 || r.status === 403) throw new Error("NOAUTH");
  return await r.json();
}

async function load(){
  try{
    var j = await api("/api/admin/overview");
    if(!j.ok) throw new Error(j.error || "加载失败");
    D = j;
    $("deny").classList.add("hide");
    $("main").classList.remove("hide");
    $("whoLine").textContent = "当前管理员：" + j.me + "　·　管理账号：" + (j.admins||[]).join("、");
    render();
  }catch(e){
    if(e.message === "NOAUTH"){
      $("deny").classList.remove("hide");
      $("main").classList.add("hide");
      $("whoLine").textContent = "未授权的访问";
    }else{
      $("whoLine").textContent = "加载失败：" + e.message;
    }
  }
}

function render(){
  var u = D.users || [];
  var totalPassed = u.reduce(function(a,x){ return a + (x.passed||0); }, 0);
  $("sUsers").textContent = u.length;
  $("sRunning").textContent = (D.runningNow||0) + " / " + (D.maxRunning||0);
  $("sPassed").textContent = totalPassed;
  $("sMem").textContent = (D.mem && D.mem.rssMB) || 0;
  $("sUp").textContent = fmtDur(D.uptimeSec);
  $("sVer").textContent = "v" + ((D.version && D.version.cloud) || "?");

  var rows = u.sort(function(a,b){ return (b.running?1:0)-(a.running?1:0) || (b.lastLogin||0)-(a.lastLogin||0); }).map(function(x){
    var riskCls = x.risk === "blocked" ? "bad" : x.risk === "cooling" ? "warn" : x.risk === "warn" ? "warn" : "on";
    var riskTxt = ({ok:"正常",warn:"有拦截",cooling:"冷却中",blocked:"已停止"})[x.risk] || (x.running ? "正常" : "-");
    return '<tr>' +
      '<td>' + esc(x.uname) + '</td>' +
      '<td>' + (x.running ? '<span class="pill on">运行中</span>' : '<span class="pill off">停止</span>') + '</td>' +
      '<td>' + (x.passed||0) + '</td>' +
      '<td>' + (x.failed||0) + '</td>' +
      '<td>' + (x.running ? '<span class="pill ' + riskCls + '">' + riskTxt + '</span>' : '-') + '</td>' +
      '<td>' + (x.online ? '✔' : '-') + '</td>' +
      '<td>' + (x.inWhitelist ? '✔' : '<span style="color:#ef9a9a">✖</span>') + '</td>' +
      '<td>' + fmtTime(x.lastLogin) + '</td>' +
      '<td>' +
        '<button class="ghost mini" data-stop="' + esc(x.uname) + '"' + (x.running ? '' : ' disabled') + '>停止</button> ' +
        '<button class="ghost mini" data-kick="' + esc(x.uname) + '"' + (x.online ? '' : ' disabled') + '>踢下线</button>' +
      '</td>' +
      '</tr>';
  }).join("");
  $("userRows").innerHTML = rows || '<tr><td colspan="9" style="color:var(--txt-dim)">还没有账号登录过</td></tr>';

  Array.prototype.forEach.call($("userRows").querySelectorAll("button[data-stop]"), function(b){
    b.onclick = function(){ action(this.dataset.stop, "stop"); };
  });
  Array.prototype.forEach.call($("userRows").querySelectorAll("button[data-kick]"), function(b){
    b.onclick = function(){ action(this.dataset.kick, "kick"); };
  });

  // 白名单
  var w = D.whitelist || { enabled:false, unames:[] };
  $("wlEnabled").value = w.enabled ? "1" : "0";
  $("wlList").innerHTML = (w.unames.length ? w.unames : []).map(function(n){
    return '<div class="wl"><div class="u">' + esc(n) + '</div>' +
      '<button class="ghost mini" data-rm="' + esc(n) + '">移除</button></div>';
  }).join("") || '<div style="color:var(--txt-dim);font-size:12px">名单为空' + (w.enabled ? '（当前开启 → 谁都登录不了）' : '') + '</div>';
  Array.prototype.forEach.call($("wlList").querySelectorAll("button[data-rm]"), function(b){
    b.onclick = function(){ wlPost({ remove:[this.dataset.rm] }); };
  });

  // 公告
  var a = D.announce || {};
  $("annTitle").value = a.title || "更新公告";
  $("annItems").value = (a.items || []).join("\n");

  // 下载
  var rel = D.release || {};
  $("relVer").value = rel.version || "";
  $("relUrl").value = rel.downloadUrl || "";
  $("relNote").value = rel.note || "";
}

async function action(uname, act){
  if(act === "kick" && !confirm("确定把 " + uname + " 踢下线？他需要重新登录。")) return;
  try{
    var j = await api("/api/admin/user-action", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ uname: uname, action: act }),
    });
    if(!j.ok) throw new Error(j.error||"操作失败");
    load();
  }catch(e){ $("whoLine").textContent = "操作失败：" + e.message; }
}

async function wlPost(body){
  try{
    var j = await api("/api/admin/whitelist", {
      method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body),
    });
    if(!j.ok) throw new Error(j.error||"保存失败");
    msg("wlMsg", "已保存", "ok");
    load();
  }catch(e){ msg("wlMsg", "失败：" + e.message, "err"); }
}

$("wlEnabled").onchange = function(){ wlPost({ enabled: this.value === "1" }); };
$("wlAddBtn").onclick = function(){
  var v = $("wlInput").value.trim();
  if(!v){ msg("wlMsg","请输入账号","err"); return; }
  var list = v.split(/[,，\s]+/).filter(Boolean);
  wlPost({ add: list }).then(function(){ $("wlInput").value = ""; });
};

$("annSave").onclick = async function(){
  var items = $("annItems").value.split(/\r?\n/).map(function(x){ return x.trim(); }).filter(Boolean);
  if(!items.length){ msg("annMsg","公告内容不能为空","err"); return; }
  try{
    var j = await api("/api/admin/announce", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        id: "manual-" + Date.now(),
        title: $("annTitle").value.trim() || "更新公告",
        date: new Date().toISOString().slice(0,10),
        items: items,
      }),
    });
    if(!j.ok) throw new Error(j.error||"发布失败");
    msg("annMsg", "已发布（" + items.length + " 条）", "ok");
    load();
  }catch(e){ msg("annMsg", "失败：" + e.message, "err"); }
};

$("relSave").onclick = async function(){
  var ver = $("relVer").value.trim(), url = $("relUrl").value.trim(), note = $("relNote").value.trim();
  if(!ver || !url){ msg("relMsg","版本号和链接都要填","err"); return; }
  if(!/^https?:\/\//.test(url)){ msg("relMsg","链接要以 http:// 或 https:// 开头","err"); return; }
  try{
    var j = await api("/api/admin/release", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ version: ver, downloadUrl: url, localFile: "", note: note }),
    });
    if(!j.ok) throw new Error(j.error||"发布失败");
    msg("relMsg", "已发布 v" + ver, "ok");
    load();
  }catch(e){ msg("relMsg", "失败：" + e.message, "err"); }
};

$("refreshBtn").onclick = load;

load();
timer = setInterval(function(){ if(!document.hidden) load(); }, 5000);
</script>
</body>
</html>

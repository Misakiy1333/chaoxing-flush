<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理后台 · 超星刷课 · 飞飞</title>
<style>
/* ===================== 设计变量 =====================
 * 和 multi.html 保持同一套 token，两个页面切换不会显得割裂。
 */
:root{
  --bg:#0a0f14;
  --surface:#101820;
  --surface-2:#0c1319;
  --surface-3:#161f28;
  --line:#1d2833;
  --line-soft:#151e26;
  --line-hi:#2a3a48;
  --txt:#e6edf3;
  --txt-dim:#8b9dab;
  --txt-faint:#5b6b78;
  --acc:#4fb8f0;
  --acc-2:#5fd4b8;
  --acc-deep:#2a7fd0;
  --acc-glow:rgba(79,184,240,.16);
  --ok:#3ecf7e;
  --warn:#e8b341;
  --bad:#f05a5a;
  --cool:#e8903a;
  --r-sm:7px;
  --r-md:10px;
  --r-lg:14px;
  --sh-1:0 1px 2px rgba(0,0,0,.3);
  --sh-2:0 4px 14px -8px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Inter","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:radial-gradient(760px 380px at 50% -8%,rgba(42,127,208,.10) 0%,transparent 70%),var(--bg);
  background-attachment:fixed;
  color:var(--txt);padding:24px 18px 40px;max-width:1180px;margin:0 auto;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-size:13.5px;line-height:1.6;min-height:100vh;
}
h1{
  font-size:19px;font-weight:650;letter-spacing:-.2px;
}
a{color:var(--acc);text-decoration:none;transition:color .15s}
a:hover{color:var(--acc-2);text-decoration:none}
code{
  background:var(--surface-3);border:1px solid var(--line);
  border-radius:4px;padding:1px 5px;font-size:11.5px;color:var(--txt-dim);
  font-family:"JetBrains Mono",Consolas,monospace;
}

/* ===================== 顶栏 ===================== */
.top{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  flex-wrap:wrap;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line-soft);
}
.sub{color:var(--txt-dim);font-size:12px;margin-top:5px;line-height:1.6}

/* ===================== 卡片 ===================== */
.card{
  background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-lg);
  padding:16px 18px;margin-bottom:12px;
  box-shadow:var(--sh-1);
}
.card h2{
  font-size:12.5px;color:var(--txt-dim);font-weight:600;margin-bottom:14px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding-bottom:10px;border-bottom:1px solid var(--line-soft);letter-spacing:.4px;
}
.card h2::before{
  content:"";width:3px;height:11px;border-radius:2px;flex:none;
  background:var(--acc-deep);
}

/* ===================== 统计 ===================== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stat{
  background:var(--surface-2);
  border:1px solid var(--line-soft);border-radius:var(--r-sm);
  padding:11px 8px 9px;text-align:center;
}
.stat b{
  display:block;font-size:19px;color:var(--txt);font-variant-numeric:tabular-nums;
  line-height:1.25;font-weight:650;letter-spacing:-.4px;
}
.stat span{font-size:10.5px;color:var(--txt-faint);display:block;margin-top:3px;letter-spacing:.2px}

/* ===================== 表格 ===================== */
.table-wrap{
  overflow-x:auto;border-radius:var(--r-md);border:1px solid var(--line-soft);
}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
th{
  color:var(--txt-faint);font-weight:600;font-size:10.5px;
  background:var(--surface-2);
  letter-spacing:.4px;position:sticky;top:0;z-index:1;
  border-bottom:1px solid var(--line);
}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .12s}
tbody tr:hover td{background:rgba(79,184,240,.04)}
td b{font-variant-numeric:tabular-nums;color:var(--txt);font-weight:600}

/* ===================== 状态标签 ===================== */
.pill{
  display:inline-flex;align-items:center;gap:5px;border-radius:20px;
  padding:2px 9px;font-size:11px;border:1px solid var(--line);
  background:var(--surface-2);font-weight:500;
}
.pill i{width:5px;height:5px;border-radius:50%;display:inline-block;flex:none;background:var(--txt-faint)}
.pill.on{color:var(--ok);border-color:rgba(62,207,126,.3)}
.pill.on i{background:var(--ok)}
.pill.off{color:var(--txt-faint)}
.pill.warn{color:var(--warn);border-color:rgba(232,179,65,.3)}
.pill.warn i{background:var(--warn)}
.pill.bad{color:var(--bad);border-color:rgba(240,90,90,.3)}
.pill.bad i{background:var(--bad)}

/* ===================== 按钮 ===================== */
button{
  background:var(--acc-deep);
  border:1px solid transparent;
  color:#fff;border-radius:var(--r-sm);padding:9px 17px;font-size:13px;
  cursor:pointer;font-family:inherit;font-weight:600;letter-spacing:.2px;
  white-space:nowrap;
  transition:filter .15s,transform .1s;
}
button:hover{filter:brightness(1.12)}
button:active{transform:translateY(1px)}
button:disabled{
  background:var(--surface-3);border-color:var(--line);color:var(--txt-faint);
  cursor:not-allowed;filter:none;transform:none;
}
button.ghost{
  background:rgba(255,255,255,.035);border:1px solid var(--line-hi);color:#a4bccc;font-weight:500;
  box-shadow:none;
}
button.ghost:hover{
  border-color:var(--acc);color:var(--acc);background:rgba(79,184,240,.06);filter:none;
}
button.danger{background:var(--bad)}
button.mini{padding:5px 11px;font-size:11.5px}

/* ===================== 表单 ===================== */
input,textarea,select{
  background:var(--surface-2);border:1px solid var(--line);color:var(--txt);
  border-radius:var(--r-sm);padding:8px 10px;font-size:12.5px;width:100%;
  font-family:inherit;transition:border-color .15s,background .15s;
}
input:hover,textarea:hover,select:hover{border-color:var(--line-hi)}
input:focus,textarea:focus,select:focus{
  outline:none;border-color:var(--acc);background:var(--surface);box-shadow:0 0 0 2px var(--acc-glow);
}
input::placeholder,textarea::placeholder{color:var(--txt-faint)}
select{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--txt-dim) 50%),linear-gradient(135deg,var(--txt-dim) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 11px) 50%;background-size:4px 4px,4px 4px;background-repeat:no-repeat;padding-right:32px}
textarea{min-height:120px;line-height:1.8;resize:vertical}
label{display:block;font-size:11px;color:var(--txt-faint);margin-bottom:5px;font-weight:500;letter-spacing:.2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.f{flex:1;min-width:150px}

/* ===================== 白名单项 ===================== */
.wl{
  display:flex;align-items:center;gap:10px;background:var(--surface-2);
  border:1px solid var(--line-soft);border-radius:var(--r-sm);
  padding:8px 11px;margin:5px 0;transition:border-color .12s;
}
.wl:hover{border-color:var(--line-hi)}
.wl .u{flex:1;font-size:13px;font-variant-numeric:tabular-nums}

/* ===================== 提示 ===================== */
.msg{font-size:12px;min-height:16px;margin-top:8px;line-height:1.6}
.ok{color:var(--ok)}
.err{color:var(--bad)}
.warn{color:var(--warn)}
.note{font-size:11.5px;color:var(--txt-faint);margin-top:8px;line-height:1.8}

/* ===================== 页脚 ===================== */
.foot{
  margin-top:20px;padding-top:14px;border-top:1px solid var(--line-soft);
  text-align:center;font-size:11.5px;color:var(--txt-faint);line-height:1.9;
}
.foot b{color:var(--txt-dim);font-weight:600}
.hide{display:none!important}

/* ===================== 响应式 ===================== */
@media(max-width:700px){
  body{padding:14px 11px 28px;font-size:13px}
  .card{padding:13px 12px;border-radius:var(--r-md)}
  .stat b{font-size:17px}
  .stats{grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px}
  th,td{padding:8px 7px;font-size:11.5px}
  h1{font-size:17px}
}
</style>
</head>
<body>

<div class="top">
  <div>
    <h1>🛠 管理后台 <span style="font-size:10.5px;color:var(--txt-faint);border:1px solid var(--line);border-radius:20px;padding:1px 9px;margin-left:5px;font-weight:400">飞飞</span></h1>
    <div class="sub" id="whoLine">正在校验权限…</div>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <button class="ghost" id="refreshBtn">刷新</button>
    <a href="/" class="ghost" style="border:1px solid var(--line-hi);border-radius:var(--r-sm);padding:7px 14px;font-size:12.5px;color:var(--txt-dim);text-decoration:none">返回前台</a>
  </div>
</div>

<div id="deny" class="card hide" style="border-left:2px solid var(--bad)">
  <h2 style="color:var(--bad)">没有权限</h2>
  <div style="font-size:12.5px;color:var(--txt-dim);line-height:1.9">
    这个页面只允许管理员账号进入。<br>
    请先用管理员的超星账号在 <a href="/">前台</a> 登录，再回来打开本页。
  </div>
</div>

<div id="main" class="hide">

  <div class="card">
    <h2>总览</h2>
    <div class="stats">
      <div class="stat"><b id="sUsers">-</b><span>账号总数</span></div>
      <div class="stat"><b id="sRunning">-</b><span>正在刷</span></div>
      <div class="stat"><b id="sPassed">-</b><span>累计完成视频</span></div>
      <div class="stat"><b id="sMem">-</b><span>内存 MB</span></div>
      <div class="stat"><b id="sUp">-</b><span>运行时长</span></div>
      <div class="stat"><b id="sVer">-</b><span>版本</span></div>
    </div>
  </div>

  <div class="card">
    <h2>用户 <span style="font-size:11px;color:var(--txt-faint);font-weight:400">每 5 秒自动刷新</span></h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>账号</th><th>状态</th><th>已完成</th><th>失败</th><th>风控</th><th>在线</th><th>白名单</th><th>最后登录</th><th>操作</th></tr>
        </thead>
        <tbody id="userRows"><tr><td colspan="9" style="color:var(--txt-faint);text-align:center;padding:20px">加载中…</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h2>白名单</h2>
    <div class="row" style="margin-bottom:10px">
      <div class="f" style="max-width:180px">
        <label>限制开关</label>
        <select id="wlEnabled">
          <option value="0">关闭（谁都能登录）</option>
          <option value="1">开启（只允许名单内）</option>
        </select>
      </div>
      <div class="f">
        <label>添加账号</label>
        <input id="wlInput" placeholder="手机号/学号，多个用逗号隔开">
      </div>
      <button id="wlAddBtn">添加</button>
    </div>
    <div id="wlList"></div>
    <div class="msg" id="wlMsg"></div>
  </div>

  <div class="card">
    <h2>更新公告</h2>
    <div class="row">
      <div class="f" style="max-width:200px"><label>标题</label><input id="annTitle" value="更新公告"></div>
    </div>
    <div style="margin-top:10px">
      <label>公告内容（每行一条）</label>
      <textarea id="annItems" placeholder="每行一条公告内容"></textarea>
    </div>
    <div style="margin-top:10px"><button id="annSave">发布公告</button></div>
    <div class="msg" id="annMsg"></div>
  </div>

  <div class="card">
    <h2>本地版下载</h2>
    <div class="row">
      <div class="f" style="max-width:120px"><label>版本号</label><input id="relVer" placeholder="3.13"></div>
      <div class="f"><label>蓝奏云分享链接</label><input id="relUrl" placeholder="https://wwang.lanzouv.com/xxxxx"></div>
    </div>
    <div class="row" style="margin-top:9px">
      <div class="f"><label>说明（含提取码，例如：本地版安装包（蓝奏云，提取码 ff666））</label><input id="relNote"></div>
      <button id="relSave">发布</button>
    </div>
    <div class="msg" id="relMsg"></div>
  </div>

  <div class="foot">
    <b>超星刷课 · 管理后台</b>　由 <b>飞飞</b> 开发维护<br>
    联系邮箱 <b>cc040921f@gmail.com</b>
  </div>
</div>

<script>
var D = {};      // 最近一次 overview 数据
var timer = null;
var annLoaded = false;   // 公告输入框是否已用服务器数据初始化过
var annDirty = false;    // 公告输入框是否被手动改过（改过就不再被自动刷新覆盖）

function $(id){ return document.getElementById(id); }
function esc(s){ var d=document.createElement("div"); d.textContent=(s==null?"":String(s)); return d.innerHTML; }
function fmtTime(ms){ if(!ms) return "-"; var d=new Date(ms); return (d.getMonth()+1)+"-"+String(d.getDate()).padStart(2,"0")+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function fmtDur(sec){ sec=Math.max(0,Math.floor(sec||0)); var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60); return h? h+"h"+m+"m" : m+"m"; }
function msg(id,t,c){ var e=$(id); if(e){ e.textContent=t||""; e.className="msg "+(c||""); } }

async function api(path, opt){
  opt = opt || {};
  var r = await fetch(path, Object.assign({ cache:"no-store" }, opt));
  if(r.status === 401 || r.status === 403) throw new Error("NOAUTH");
  return await r.json();
}

async function load(){
  try{
    var j = await api("/api/admin/overview");
    if(!j.ok) throw new Error(j.error || "加载失败");
    D = j;
    $("deny").classList.add("hide");
    $("main").classList.remove("hide");
    $("whoLine").textContent = "当前管理员：" + j.me + "　·　管理账号：" + (j.admins||[]).join("、");
    render();
  }catch(e){
    if(e.message === "NOAUTH"){
      $("deny").classList.remove("hide");
      $("main").classList.add("hide");
      $("whoLine").textContent = "未授权的访问";
    }else{
      $("whoLine").textContent = "加载失败：" + e.message;
    }
  }
}

function render(){
  var u = D.users || [];
  var totalPassed = u.reduce(function(a,x){ return a + (x.passed||0); }, 0);
  $("sUsers").textContent = u.length;
  $("sRunning").textContent = (D.runningNow||0) + " / " + (D.maxRunning||0);
  $("sPassed").textContent = totalPassed;
  $("sMem").textContent = (D.mem && D.mem.rssMB) || 0;
  $("sUp").textContent = fmtDur(D.uptimeSec);
  $("sVer").textContent = "v" + ((D.version && D.version.cloud) || "?");

  var rows = u.sort(function(a,b){ return (b.running?1:0)-(a.running?1:0) || (b.lastLogin||0)-(a.lastLogin||0); }).map(function(x){
    var riskCls = x.risk === "blocked" ? "bad" : x.risk === "cooling" ? "warn" : x.risk === "warn" ? "warn" : "on";
    var riskTxt = ({ok:"正常",warn:"有拦截",cooling:"冷却中",blocked:"已停止"})[x.risk] || (x.running ? "正常" : "-");
    return '<tr>' +
      '<td>' + esc(x.uname) + '</td>' +
      '<td>' + (x.running ? '<span class="pill on">运行中</span>' : '<span class="pill off">停止</span>') + '</td>' +
      '<td>' + (x.passed||0) + '</td>' +
      '<td>' + (x.failed||0) + '</td>' +
      '<td>' + (x.running ? '<span class="pill ' + riskCls + '">' + riskTxt + '</span>' : '-') + '</td>' +
      '<td>' + (x.online ? '✔' : '-') + '</td>' +
      '<td>' + (x.inWhitelist ? '✔' : '<span style="color:#ef9a9a">✖</span>') + '</td>' +
      '<td>' + fmtTime(x.lastLogin) + '</td>' +
      '<td>' +
        '<button class="ghost mini" data-stop="' + esc(x.uname) + '"' + (x.running ? '' : ' disabled') + '>停止</button> ' +
        '<button class="ghost mini" data-kick="' + esc(x.uname) + '"' + (x.online ? '' : ' disabled') + '>踢下线</button>' +
      '</td>' +
      '</tr>';
  }).join("");
  $("userRows").innerHTML = rows || '<tr><td colspan="9" style="color:var(--txt-dim)">还没有账号登录过</td></tr>';

  Array.prototype.forEach.call($("userRows").querySelectorAll("button[data-stop]"), function(b){
    b.onclick = function(){ action(this.dataset.stop, "stop"); };
  });
  Array.prototype.forEach.call($("userRows").querySelectorAll("button[data-kick]"), function(b){
    b.onclick = function(){ action(this.dataset.kick, "kick"); };
  });

  // 白名单
  var w = D.whitelist || { enabled:false, unames:[] };
  $("wlEnabled").value = w.enabled ? "1" : "0";
  $("wlList").innerHTML = (w.unames.length ? w.unames : []).map(function(n){
    return '<div class="wl"><div class="u">' + esc(n) + '</div>' +
      '<button class="ghost mini" data-rm="' + esc(n) + '">移除</button></div>';
  }).join("") || '<div style="color:var(--txt-dim);font-size:12px">名单为空' + (w.enabled ? '（当前开启 → 谁都登录不了）' : '') + '</div>';
  Array.prototype.forEach.call($("wlList").querySelectorAll("button[data-rm]"), function(b){
    b.onclick = function(){ wlPost({ remove:[this.dataset.rm] }); };
  });

  // 公告
  // 注意：load() 每 5 秒自动跑一次，若无条件回填输入框，管理员正在写的公告
  // 会在 5 秒内被服务器上的旧内容覆盖掉——这是"发公告不好用"的主因。
  // 首次加载一定回填；之后只有输入框为空、或未被手动编辑时才回填。
  var a = D.announce || {};
  if(!annLoaded){
    $("annTitle").value = a.title || "更新公告";
    $("annItems").value = (a.items || []).join("\n");
    annLoaded = true;
  }else if(!annDirty){
    if(!$("annTitle").value) $("annTitle").value = a.title || "更新公告";
    if(!$("annItems").value) $("annItems").value = (a.items || []).join("\n");
  }

  // 下载
  var rel = D.release || {};
  $("relVer").value = rel.version || "";
  $("relUrl").value = rel.downloadUrl || "";
  $("relNote").value = rel.note || "";
}

async function action(uname, act){
  if(act === "kick" && !confirm("确定把 " + uname + " 踢下线？他需要重新登录。")) return;
  try{
    var j = await api("/api/admin/user-action", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ uname: uname, action: act }),
    });
    if(!j.ok) throw new Error(j.error||"操作失败");
    load();
  }catch(e){ $("whoLine").textContent = "操作失败：" + e.message; }
}

async function wlPost(body){
  try{
    var j = await api("/api/admin/whitelist", {
      method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body),
    });
    if(!j.ok) throw new Error(j.error||"保存失败");
    msg("wlMsg", "已保存", "ok");
    load();
  }catch(e){ msg("wlMsg", "失败：" + e.message, "err"); }
}

$("wlEnabled").onchange = function(){ wlPost({ enabled: this.value === "1" }); };
$("wlAddBtn").onclick = function(){
  var v = $("wlInput").value.trim();
  if(!v){ msg("wlMsg","请输入账号","err"); return; }
  var list = v.split(/[,，\s]+/).filter(Boolean);
  wlPost({ add: list }).then(function(){ $("wlInput").value = ""; });
};

// 一旦开始编辑公告，就标记为"脏"，自动刷新不再覆盖输入框
["annTitle","annItems"].forEach(function(id){
  var el = $(id);
  if(el) el.addEventListener("input", function(){ annDirty = true; });
});

$("annSave").onclick = async function(){
  var items = $("annItems").value.split(/\r?\n/).map(function(x){ return x.trim(); }).filter(Boolean);
  if(!items.length){ msg("annMsg","公告内容不能为空","err"); return; }
  var btn = this;
  btn.disabled = true;
  msg("annMsg","发布中…","");
  try{
    var j = await api("/api/admin/announce", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        id: "manual-" + Date.now(),
        title: $("annTitle").value.trim() || "更新公告",
        date: new Date().toISOString().slice(0,10),
        items: items,
      }),
    });
    // 后端出错时会返回 { ok:false, error:"..." }，这里要把原因原样告诉用户，
    // 以前统一抛 "NOAUTH" 或空消息，管理员完全看不出是权限、网络还是内容问题。
    if(!j || !j.ok) throw new Error((j && j.error) || "服务器拒绝了请求");
    msg("annMsg", "✔ 已发布（" + items.length + " 条），用户刷新页面即可看到", "ok");
    // 发布成功后：清掉草稿标记，并用服务器返回的内容回填，保证与线上一致
    annDirty = false;
    var saved = j.announcement || {};
    D.announce = saved;
    $("annTitle").value = saved.title || "更新公告";
    $("annItems").value = (saved.items || items).join("\n");
  }catch(e){
    var m = e && e.message;
    if(m === "NOAUTH") m = "无权限（请用管理员账号登录后重试）";
    else if(!m || m === "Failed to fetch") m = "连不上服务器，检查网络或服务是否在运行";
    msg("annMsg", "发布失败：" + m, "err");
  }finally{
    btn.disabled = false;
  }
};

$("relSave").onclick = async function(){
  var ver = $("relVer").value.trim(), url = $("relUrl").value.trim(), note = $("relNote").value.trim();
  if(!ver || !url){ msg("relMsg","版本号和链接都要填","err"); return; }
  if(!/^https?:\/\//.test(url)){ msg("relMsg","链接要以 http:// 或 https:// 开头","err"); return; }
  try{
    var j = await api("/api/admin/release", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ version: ver, downloadUrl: url, localFile: "", note: note }),
    });
    if(!j.ok) throw new Error(j.error||"发布失败");
    msg("relMsg", "已发布 v" + ver, "ok");
    load();
  }catch(e){ msg("relMsg", "失败：" + e.message, "err"); }
};

$("refreshBtn").onclick = load;

load();
timer = setInterval(function(){ if(!document.hidden) load(); }, 5000);
</script>
